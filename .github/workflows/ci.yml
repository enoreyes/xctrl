name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxtst-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            clang \
            libclang-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libdrm-dev \
            pkg-config

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      # ── Linux dependencies ──────────────────────────────────────
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxdo-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxtst-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            clang \
            libclang-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libdrm-dev \
            pkg-config \
            xvfb \
            ffmpeg \
            xdotool

      # ── macOS dependencies ──────────────────────────────────────
      # Most macOS deps are available via system frameworks.
      # FFmpeg is pre-installed on GitHub macOS runners.

      # ── Windows dependencies ────────────────────────────────────
      # The windows crate uses Win32 APIs directly; no extra deps needed.

      # ── Build ───────────────────────────────────────────────────
      - name: Build
        run: cargo build

      # ── Tests ───────────────────────────────────────────────────
      - name: Run tests (Linux — with Xvfb)
        if: runner.os == 'Linux'
        run: |
          # Start Xvfb on display :99
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          XVFB_PID=$!
          sleep 2

          export DISPLAY=:99

          # Run tests with a timeout to prevent CI hangs
          timeout 600 cargo test -- --test-threads=2 || TEST_EXIT=$?

          kill $XVFB_PID 2>/dev/null || true

          exit ${TEST_EXIT:-0}

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        run: cargo test -- --test-threads=2

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test -- --test-threads=2
        timeout-minutes: 10
