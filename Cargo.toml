[package]
name = "xctrl"
version = "0.1.0"
edition = "2021"
description = "Cross-platform computer control CLI"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = "3.6"
clap = { version = "4", features = ["derive"] }
enigo = { version = "0.6", default-features = true }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }

[dev-dependencies]
libc = "0.2"
serde_json = "1"
